---
layout: default
---
<style>
    .post-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .post-date {
        margin-top: 10px;
    }
    .post-footer {
        text-align: center;
        margin-top: 60px;
    }
    .post-footer a {
        margin: 0 15px; /* Adds horizontal space between the links */
    }
</style>

<div class="post-header">
    <h1>{{ page.title }}</h1>
    <!-- This automatically formats the date like "September 29, 2026" -->
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
</div>

<div class="post-content">
    {{ content }}
</div>

<div class="post-footer">
    <a href="/essays.html">Back to Essay List</a>
    <a href="/">Home</a>
</div>
