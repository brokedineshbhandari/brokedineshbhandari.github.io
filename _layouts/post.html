---
layout: default
---
<style>
    .post-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .post-date {
        margin-top: 10px;
    }
    
</style>

<div class="post-header">
    <h1>{{ page.title }}</h1>
    <!-- This automatically formats the date like "September 29, 2026" -->
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
</div>
