---
layout: default
---
<style>
    .post-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .post-date {
        margin-top: 10px;
        font-size: 11pt;
    }
</style>

<div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
</div>

<!-- This is the crucial part that displays your essay text -->
<div class="post-content">
    {{ content }}
</div>
